name = "habla-tutor"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# --- Secrets (set these, don't commit them) --------------------------------
#   npx wrangler secret put ANTHROPIC_API_KEY     # required
#   npx wrangler secret put ACCESS_TOKEN          # optional shared password
#
# --- Plain vars (safe to keep here) ----------------------------------------
# Lock the API to your site so other pages can't call it from a browser.
# [vars]
# ALLOWED_ORIGIN = "https://tadellsworth.github.io"

# --- Cloud progress backup (optional) --------------------------------------
# Create a KV namespace, then paste its id below and redeploy:
#   npx wrangler kv namespace create HABLA_SYNC
# [[kv_namespaces]]
# binding = "HABLA_SYNC"
# id = "paste-the-id-from-the-command-above"
